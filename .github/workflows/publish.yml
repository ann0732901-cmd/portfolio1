name: Publish portfolio

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release website archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --pattern "portfolio1-site.zip" --dir .

      - name: Extract and clean archive
        run: |
          unzip -oq portfolio1-site.zip -d .
          rm portfolio1-site.zip

      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish portfolio files"
          git push
