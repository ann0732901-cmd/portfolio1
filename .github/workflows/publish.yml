name: Publish portfolio

on:
  push:
    paths:
      - portfolio1-site.zip.aa
      - portfolio1-site.zip.ab
      - portfolio1-site.zip.ac
      - portfolio1-site.zip.ad

permissions:
  contents: write

jobs:
  unpack:
    if: hashFiles('portfolio1-site.zip.aa') != '' && hashFiles('portfolio1-site.zip.ab') != '' && hashFiles('portfolio1-site.zip.ac') != '' && hashFiles('portfolio1-site.zip.ad') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and extract website
        run: |
          cat portfolio1-site.zip.* > portfolio1-site.zip
          unzip -oq portfolio1-site.zip -d .
          rm portfolio1-site.zip portfolio1-site.zip.*

      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish portfolio files"
          git push
