name: Publish portfolio

on:
  push:
    paths:
      - portfolio1-site.zip

permissions:
  contents: write

jobs:
  unpack:
    if: hashFiles('portfolio1-site.zip') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website files
        run: |
          unzip -oq portfolio1-site.zip -d .
          rm portfolio1-site.zip

      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish portfolio files"
          git push
